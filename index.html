<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praesto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
  --bg:#faf5ec; --bg-panel:#ffffff; --bg-panel-2:#f2ead9;
  --paper:#f8f2e2;
  --parchment:#2a1c12; --parchment-dim:#5c4a38;
  --crust:#cf9a4a; --crust-bright:#e3b565; --crust-deep:#93641c;
  --tomato:#b8402f; --tomato-bright:#d15b48;
  --basil:#6f9160; --basil-bright:#89ac78;
  --ink:#241610; --muted:#8a7360; --line:#e6d9c0; --radius:14px;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, #f2e6cc 0%, transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, #f5ead4 0%, transparent 55%),
    var(--bg);
  color:var(--parchment); font-family:'Work Sans', sans-serif; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--crust-bright); outline-offset:2px;}
.app{max-width:640px;margin:0 auto;padding:28px 20px 80px;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;}}
h1,h2,h3{font-family:'Fraunces', serif;margin:0;font-weight:700;letter-spacing:-0.01em;}
.brandbar{display:flex;align-items:center;gap:13px;margin-bottom:24px;}
.mark{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-family:'Fraunces',serif;font-weight:700;background:var(--m-accent, var(--crust));color:#1a0f08;box-shadow:inset 0 0 0 2px rgba(255,255,255,0.18);}
.brandbar .name{font-size:20px;color:var(--parchment);line-height:1.2;}
.brandbar .tag{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;}
.open-dot{width:7px;height:7px;border-radius:50%;background:var(--basil-bright);display:inline-block;}
.open-dot.closed{background:var(--tomato-bright);}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;}
.card + .card{margin-top:16px;}
.btn{font-family:'Work Sans',sans-serif;font-weight:600;font-size:15px;padding:13px 20px;border-radius:10px;border:none;cursor:pointer;transition:transform .08s ease, opacity .15s ease;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent, var(--crust)); color:#1a0f08;}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:transparent;color:var(--parchment);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--muted);}
.btn-danger{background:var(--tomato);color:#fff0ea;}
.btn-confirm{background:var(--basil);color:#0f1a0d;}
.btn-warn{background:var(--tomato-bright);color:#2a0f0a;}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:8px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.field input, .field select, .field textarea{width:100%;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--parchment);border-radius:9px;padding:11px 12px;font-size:15px;font-family:'Work Sans',sans-serif;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent, var(--crust));outline-offset:1px;}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}
.link-back{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 0;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;}
.link-back:hover{color:var(--parchment);}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);}
.menu-item:last-child{border-bottom:none;}
.menu-item .mi-name{font-size:15.5px;font-weight:600;}
.menu-item .mi-price{font-size:13px;color:var(--muted);margin-top:2px;}
.qty-ctrl{display:flex;align-items:center;gap:10px;}
.qty-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg-panel-2);color:var(--parchment);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{border-color:var(--crust);}
.qty-num{min-width:18px;text-align:center;font-weight:600;}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.slot{padding:10px 6px;border-radius:9px;border:1px solid var(--line);background:var(--bg-panel-2);text-align:center;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--parchment);transition:transform .1s ease, border-color .15s ease;}
.slot .cap{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px;}
.slot.selected{border-color:var(--accent,var(--crust));background:color-mix(in srgb, var(--accent,var(--crust)) 24%, var(--bg-panel-2));transform:scale(1.03);}
.slot.full{opacity:.35;cursor:not-allowed;}
.ticket{position:relative;background:var(--paper);color:var(--ink);border-radius:10px;padding:20px 20px 22px;margin-top:6px;}
.ticket::before{content:"";position:absolute;top:-6px;left:0;right:0;height:12px;background-image:radial-gradient(circle at 8px 6px, var(--bg) 5px, transparent 5.5px);background-size:16px 12px; background-repeat:repeat-x;}
.ticket .tline{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed #c9bb9c;}
.ticket .tline:last-of-type{border-bottom:none;}
.ticket .ttotal{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:2px solid var(--ink);font-weight:700;font-size:16px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.status-pending{background:#4a3a1a;color:#e3b565;}
.status-confirmed{background:#243d1e;color:var(--basil-bright);}
.status-rejected{background:#3d221e;color:var(--tomato-bright);}
.status-ready{background:#1e3140;color:#7ec3e0;}
.status-proposed{background:#2e2140;color:#c9a8e0;}
.propose-area{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.propose-area .ph{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.order-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--bg-panel-2);}
.order-card .oc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px;}
.order-card .oc-items{font-size:13.5px;color:var(--parchment-dim);line-height:1.6;margin-bottom:10px;}
.order-card .oc-actions{display:flex;gap:8px;}
.empty{text-align:center;padding:40px 16px;color:var(--muted);}
.empty .big{font-size:34px;margin-bottom:8px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.setup-hero{text-align:center;padding:24px 0 8px;}
.setup-hero .big-title{font-size:30px;line-height:1.15;margin-bottom:8px;}
.setup-hero p{color:var(--muted);font-size:14.5px;max-width:400px;margin:0 auto;}
.divider{height:1px;background:var(--line);margin:20px 0;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.color-chip{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.color-chip.selected{border-color:var(--parchment);}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent,var(--crust));animation:spin .7s linear infinite;margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.small-note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
.check-anim{width:70px;height:70px;border-radius:50%;background:var(--basil);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(0);} to{transform:scale(1);}}
.check-anim svg{width:34px;height:34px;}
.link-box{background:var(--bg-panel-2); border:1px dashed var(--line); border-radius:10px;padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:12.5px;word-break:break-all; color:var(--crust-deep);}
.qr-wrap{text-align:center;margin:16px 0;}
.qr-wrap img, .qr-wrap canvas{border-radius:10px;background:#fff;}
.foot-link{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg-panel);border:1px solid var(--line);border-radius:11px;padding:4px;}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);}
.tab.active{background:var(--accent,var(--crust));color:#1a0f08;}
.prep-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--bg-panel-2);display:flex;gap:14px;align-items:center;}
.prep-card.next{border-color:var(--accent,var(--crust));background:color-mix(in srgb, var(--accent,var(--crust)) 10%, var(--bg-panel-2));}
.prep-time{font-family:'Fraunces',serif;font-weight:700;font-size:20px;text-align:center;min-width:58px;color:var(--accent,var(--crust));}
.prep-time span{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;font-family:'Work Sans',sans-serif;}
.prep-info{flex:1;}
.prep-info b{font-size:14.5px;display:block;}
.prep-info .items{font-size:12.5px;color:var(--parchment-dim);margin-top:2px;}
.next-badge{background:var(--accent,var(--crust));color:#1a0f08;font-size:10.5px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:100px;margin-bottom:6px;display:inline-block;}
.kitchen-card{border:2px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:16px;background:var(--bg-panel-2);display:flex;gap:20px;align-items:center;}
.kitchen-card.next{border-color:var(--accent,var(--crust));background:color-mix(in srgb, var(--accent,var(--crust)) 14%, var(--bg-panel-2));}
.kitchen-time{font-family:'Fraunces',serif;font-weight:700;font-size:40px;color:var(--accent,var(--crust));min-width:110px;text-align:center;}
.kitchen-info b{font-size:24px;display:block;}
.kitchen-info .items{font-size:17px;color:var(--parchment-dim);margin-top:4px;}
.tenant-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;}
.tenant-row .info b{display:block;font-size:14.5px;}
.tenant-row .info span{font-size:12px;color:var(--muted);}
.banner{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.banner-warn{background:#3d221e;color:var(--tomato-bright);border:1px solid #5a2f28;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px;}
.toggle-row b{font-size:14.5px;display:block;}
.toggle-row span{font-size:12px;color:var(--muted);}
.switch{width:46px;height:26px;border-radius:100px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s ease;}
.switch.on{background:var(--basil);}
.switch .knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s ease;}
.switch.on .knob{left:23px;}
</style>
</head>

  const DB_URL = "https://appizzeria-74675-default-rtdb.europe-west1.firebasedatabase.app";
  function keyToPath(key){
    if(key.indexOf('orderitem:') === 0){
      const rest = key.slice(10); const sep = rest.indexOf(':');
      return 'orders/' + encodeURIComponent(rest.slice(0,sep)) + '/' + encodeURIComponent(rest.slice(sep+1));
    }
    if(key.indexOf('orders:') === 0) return 'orders/' + encodeURIComponent(key.slice(7));
    if(key.indexOf('tenant:') === 0) return 'tenants/' + encodeURIComponent(key.slice(7));
    return key;
  }
  async function sGet(key){
    try{
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), 9000);
      const res = await fetch(`${DB_URL}/${keyToPath(key)}.json`, {signal: controller.signal});
      clearTimeout(timer);
      if(!res.ok) return null;
      return await res.json();
    } catch(e){ console.error('firebase get failed', e); return null; }
  }
  async function sSet(key, value){
    try{
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), 9000);
      const res = await fetch(`${DB_URL}/${keyToPath(key)}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(value),
        signal: controller.signal
      });
      clearTimeout(timer);
      return res.ok;
    } catch(e){ console.error('firebase set failed', e); return false; }
  }
  async function sDelete(key){
    try{
      const res = await fetch(`${DB_URL}/${keyToPath(key)}.json`, {method: 'DELETE'});
      return res.ok;
    } catch(e){ console.error('firebase delete failed', e); return false; }
  }
  async function sha256(msg){
    const enc = new TextEncoder().encode(msg);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  const root = document.getElementById('root');
  let toastTimer = null;
  function toast(msg){
    let el = document.getElementById('toast');
    if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
  }
  function uid(prefix){ return (prefix||'') + Math.random().toString(36).slice(2,7).toUpperCase(); }

  // --- Avviso sonoro nuovo ordine ---
  // Controlla periodicamente Firebase mentre il pannello ordini è aperto:
  // se arriva un nuovo ordine da un altro dispositivo, suona un bip e aggiorna la lista.
  let watchedSlug = null;
  let watcherInterval = null;
  let lastKnownOrderCount = null;
  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; gain.gain.value = 0.15;
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } catch(e){ /* audio non disponibile, ignora */ }
  }
  function startOrderWatcher(slug){
    if(watchedSlug === slug && watcherInterval) return;
    if(watcherInterval) clearInterval(watcherInterval);
    watchedSlug = slug;
    lastKnownOrderCount = null;
    watcherInterval = setInterval(async ()=>{
      if(state.view !== 'ownerDashboard' || !state.activeTenant || state.activeTenant.slug !== slug){
        clearInterval(watcherInterval); watcherInterval = null; watchedSlug = null; return;
      }
      const orders = await loadOrders(slug);
      if(lastKnownOrderCount === null){ lastKnownOrderCount = orders.length; return; }
      if(orders.length > lastKnownOrderCount){
        beep();
        if((state.ownerTab||'ordini')==='ordini') render();
      }
      lastKnownOrderCount = orders.length;
    }, 15000);
  }

  function todayStr(offsetDays){ const d = new Date(); d.setDate(d.getDate() + (offsetDays||0)); return d.toISOString().slice(0,10); }
  function dayLabel(offsetDays){
    if(offsetDays===0) return 'Oggi';
    if(offsetDays===1) return 'Domani';
    const d = new Date(); d.setDate(d.getDate()+offsetDays);
    return d.toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short'});
  }
  function dayLabelFromDate(dateStr){
    if(dateStr === todayStr(0)) return 'Oggi';
    if(dateStr === todayStr(1)) return 'Domani';
    return new Date(dateStr).toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short'});
  }
  function genSlots(openFrom, openTo, slotMinutes){
    const slots = [];
    let [h,m] = openFrom.split(':').map(Number);
    const [eh,em] = openTo.split(':').map(Number);
    let cur = h*60+m; const end = eh*60+em;
    while(cur < end){
      slots.push(String(Math.floor(cur/60)).padStart(2,'0')+':'+String(cur%60).padStart(2,'0'));
      cur += Number(slotMinutes);
    }
    return slots;
  }
  function isOpenNow(slots){
    const now = new Date(); const mins = now.getHours()*60 + now.getMinutes();
    const [oh,om] = slots.openFrom.split(':').map(Number);
    const [ch,cm] = slots.openTo.split(':').map(Number);
    return mins >= (oh*60+om) && mins <= (ch*60+cm);
  }
  function markHTML(t){
    if(t.logoDataUrl) return `<img src="${t.logoDataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    if(t.emoji && t.emoji.trim()) return t.emoji;
    return (t.name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }

  async function loadOrders(slug){
    const raw = await sGet('orders:'+slug);
    if(!raw) return [];
    return Array.isArray(raw) ? raw : Object.values(raw);
  }
  async function saveOrderItem(slug, order){ return sSet('orderitem:'+slug+':'+order.id, order); }
  async function loadAllTenants(){
    const slugs = (await sGet('tenant_index')) || [];
    const list = await Promise.all(slugs.map(s => sGet('tenant:'+s)));
    return list.filter(Boolean);
  }
  async function loadSiblingTenants(t){
    if(!t.groupSlug) return [t];
    const all = await loadAllTenants();
    const siblings = all.filter(x=> x.groupSlug === t.groupSlug);
    return siblings.length ? siblings : [t];
  }

  async function renderSlotsAsync(container, tenant, dayOffset){
    container.innerHTML = `<div class="spinner"></div>`;
    const cfg = tenant.slots;
    const slots = genSlots(cfg.openFrom, cfg.openTo, cfg.slotMinutes);
    const date = todayStr(dayOffset);
    const closed = (tenant.closedDates||[]).includes(date);
    const blockedSet = new Set(tenant.blockedSlots||[]);
    const orders = await loadOrders(tenant.slug);
    container.innerHTML = '';
    if(slots.length===0){ container.innerHTML = '<p class="small-note">Nessuna fascia configurata.</p>'; return; }
    slots.forEach(time=>{
      const slotBlocked = closed || blockedSet.has(date+'|'+time);
      const booked = orders.filter(o=> o.date===date && o.time===time && o.status!=='rejected').length;
      const remaining = slotBlocked ? 0 : cfg.capacityPerSlot - booked;
      const full = remaining <= 0;
      const btn = document.createElement('button');
      btn.className = 'slot' + (full ? ' full' : '') + ((state.selectedSlot && state.selectedSlot.date===date && state.selectedSlot.time===time) ? ' selected' : '');
      btn.innerHTML = `${time}<span class="cap">${slotBlocked ? 'chiuso' : (full ? 'pieno' : remaining+' post.')}</span>`;
      btn.disabled = full;
      btn.onclick = ()=> setState({selectedSlot:{date, time}});
      container.appendChild(btn);
    });
  }

  async function submitOrder(){
    const t = state.activeTenant;
    const items = (t.menu||[]).filter(m=>state.cart[m.id]>0).map(m=>({id:m.id, name:m.name, price:m.price, qty:state.cart[m.id]}));
    if(items.length===0 || !state.selectedSlot) return;
    const order = { id: uid('T-'), customerName: state.customerName, customerPhone: state.customerPhone, note: state.orderNote,
      items, total: items.reduce((s,i)=>s+i.price*i.qty,0), date: state.selectedSlot.date, time: state.selectedSlot.time, status: 'pending', createdAt: Date.now() };
    const ok = await saveOrderItem(t.slug, order);
    if(ok){ setState({view:'customerConfirmation', lastOrderId: order.id, cart:{}, selectedSlot:null, customerName:'', customerPhone:'', orderNote:''}); }
    else { toast('Errore di connessione, riprova.'); }
  }

    const t = state.activeTenant;
    const orderId = state.lastOrderId;
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="brandbar"><div class="mark" style="--m-accent:${t.accent}">${markHTML(t)}</div><div><div class="name">${t.name}</div></div></div>
      <div class="card" style="text-align:center;padding:36px 22px;">
        <div class="check-anim"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#0f1a0d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h2 style="margin-bottom:8px;">Ordine inviato</h2>
        <div class="banner banner-warn" style="text-align:left;margin-bottom:16px;">⚠️ <b>Salva questo codice</b>: ti servirà per ritirare l'ordine.</div>
        <p style="color:var(--muted);font-size:14.5px;margin-bottom:4px;">Codice ordine</p>
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;">
          <p style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:var(--accent, var(--crust));margin:0;">${orderId}</p>
          <button class="btn btn-ghost btn-sm" id="copy-code" title="Copia il codice">📋 Copia</button>
        </div>
        <div id="live-status"></div>
      </div>
      <button class="btn btn-ghost btn-block" id="new-order">Fai un altro ordine</button>`;
    wrap.querySelector('#new-order').onclick = ()=>{ if(confirmationPollInterval){ clearInterval(confirmationPollInterval); confirmationPollInterval = null; } setState({view:'customerOrder'}); };
    wrap.querySelector('#copy-code').onclick = async ()=>{
      try{ await navigator.clipboard.writeText(orderId); toast('Codice copiato'); }
      catch(e){ toast('Copia non riuscita: seleziona e copia il codice a mano.'); }
    };

    const statusEl = wrap.querySelector('#live-status');
    function renderLiveStatus(order){
      if(!order){ statusEl.innerHTML = `<p style="color:var(--parchment-dim);font-size:14.5px;line-height:1.6;">Il locale sta verificando la disponibilità e ti confermerà a breve.</p>`; return; }
      if(order.status === 'pending'){
        statusEl.innerHTML = `<p style="color:var(--parchment-dim);font-size:14.5px;line-height:1.6;">⏳ In attesa di conferma dal locale — questa pagina si aggiorna da sola, non serve ricaricare.</p>`;
      } else if(order.status === 'confirmed'){
        statusEl.innerHTML = `<p style="color:var(--basil-bright);font-weight:700;font-size:15.5px;margin-bottom:6px;">✅ Ordine confermato!</p><p style="color:var(--parchment-dim);font-size:14.5px;">Ritira ${dayLabelFromDate(order.date).toLowerCase()} alle ${order.time}.</p>`;
      } else if(order.status === 'rejected'){
        statusEl.innerHTML = `<p style="color:var(--tomato-bright);font-weight:700;font-size:15.5px;margin-bottom:6px;">Il locale non può accettare questo orario</p><p style="color:var(--parchment-dim);font-size:14.5px;">Prova a proporre un altro orario con un nuovo ordine.</p>`;
      } else if(order.status === 'proposed'){
        statusEl.innerHTML = `<p style="color:var(--crust-deep);font-weight:700;font-size:15.5px;margin-bottom:10px;">Il locale propone un nuovo orario: ${dayLabelFromDate(order.proposedDate)} alle ${order.proposedTime}</p>`;
        const row = document.createElement('div'); row.className = 'row';
        const acceptBtn = document.createElement('button'); acceptBtn.className='btn btn-confirm'; acceptBtn.textContent='Accetta';
        acceptBtn.onclick = ()=> respondToProposalDirect(t, order, true);
        const declineBtn = document.createElement('button'); declineBtn.className='btn btn-danger'; declineBtn.textContent='Rifiuta';
        declineBtn.onclick = ()=> respondToProposalDirect(t, order, false);
        row.appendChild(acceptBtn); row.appendChild(declineBtn);
        statusEl.appendChild(row);
      } else if(order.status === 'ready'){
        statusEl.innerHTML = `<p style="color:var(--basil-bright);font-weight:700;font-size:15.5px;margin-bottom:6px;">🎉 Il tuo ordine è pronto!</p><p style="color:var(--parchment-dim);font-size:14.5px;">Puoi venire a ritirarlo.</p>`;
        if(hasPlus(t) && t.googleReviewLink){
          const reviewBox = document.createElement('div');
          reviewBox.style.cssText = 'margin-top:16px;padding-top:16px;border-top:1px solid var(--line);';
          reviewBox.innerHTML = `<p style="font-size:13.5px;color:var(--parchment-dim);margin-bottom:10px;">Ti è piaciuto? Un minuto per una recensione ci aiuta molto.</p>`;
          const reviewBtn = document.createElement('a');
          reviewBtn.href = t.googleReviewLink; reviewBtn.target = '_blank'; reviewBtn.rel = 'noopener';
          reviewBtn.className = 'btn btn-primary btn-block'; reviewBtn.textContent = '⭐ Lascia una recensione';
          reviewBox.appendChild(reviewBtn);
          statusEl.appendChild(reviewBox);
        }
      }
    }
    renderLiveStatus(null);

    if(confirmationPollInterval) clearInterval(confirmationPollInterval);
    let prevStatus = null;
    async function poll(){
      if(state.view !== 'customerConfirmation' || state.lastOrderId !== orderId){ clearInterval(confirmationPollInterval); confirmationPollInterval = null; return; }
      const order = await sGet('orderitem:'+t.slug+':'+orderId);
      if(order && prevStatus !== null && order.status !== prevStatus){ beep(); }
      if(order) prevStatus = order.status;
      renderLiveStatus(order);
    }
    poll();
    confirmationPollInterval = setInterval(poll, 5000);
    return wrap;
  }

  async function respondToProposalDirect(t, order, accept){
    if(accept){
      order.status = 'confirmed';
      order.date = order.proposedDate;
      order.time = order.proposedTime;
    } else {
      order.status = 'rejected';
    }
    const ok = await saveOrderItem(t.slug, order);
    if(ok) toast(accept ? 'Nuovo orario accettato' : 'Proposta rifiutata');
    else toast('Errore, riprova.');
  }

  async function submitCheckOrder(){
    const t = state.activeTenant;
    if(!state.checkOrderInput){ setState({checkOrderError:'Inserisci il codice ordine.'}); return; }
    const normalizedId = state.checkOrderInput.trim().toUpperCase();
    let o = await sGet('orderitem:'+t.slug+':'+normalizedId);
    if(!o){
      // ripiego: cerca nell'elenco completo, nel caso l'id non combaci esattamente
      const orders = await loadOrders(t.slug);
      o = orders.find(x=> x.id && x.id.toUpperCase() === normalizedId) || null;
    }
    if(!o){ setState({checkedOrder:null, checkOrderError:'Codice non trovato.'}); return; }
    setState({checkedOrder:o, checkOrderError:''});
  }

  async function respondToProposal(accept){
    const t = state.activeTenant;
    const o = state.checkedOrder;
    const order = await sGet('orderitem:'+t.slug+':'+o.id);
    if(!order) return;
    if(accept){
      order.status = 'confirmed';
      order.date = order.proposedDate;
      order.time = order.proposedTime;
    } else {
      order.status = 'rejected';
    }
    const ok = await saveOrderItem(t.slug, order);
    if(ok){ toast(accept ? 'Nuovo orario accettato' : 'Proposta rifiutata'); setState({checkedOrder: order}); }
    else toast('Errore, riprova.');
  }

  async function doOwnerLogin(){
    if(!state.loginSlugInput || !state.loginPinInput){ setState({loginError:'Inserisci codice locale e PIN.'}); return; }
    const t = await sGet('tenant:'+state.loginSlugInput);
    if(!t){ setState({loginError:'Codice locale non trovato.'}); return; }
    const hash = await sha256(state.loginPinInput);
    if(hash !== t.pinHash){ setState({loginError:'PIN non corretto.'}); return; }
    setState({activeTenant:t, activeSlug:t.slug, view:'ownerDashboard', loginError:''});
  }

          </select>`;
        setTimeout(()=>{
          switcher.querySelector('#site-select').onchange = (e)=>{
            const chosen = siblings.find(s=>s.slug===e.target.value);
            if(chosen) setState({activeTenant:chosen, ownerTab:'ordini'});

        content.querySelector('#period-toggle').onclick = ()=> togglePeriodForm(content, t);

  async function togglePhoneOrderForm(wrap, t){
    const area = wrap.querySelector('#phone-order-form');
    const isOpen = area.style.display !== 'none';
    if(isOpen){ area.style.display='none'; return; }
    area.style.display='block';
    let selectedOffset = 0;
    let poCart = {};
    area.innerHTML = `<div class="card">
      <h3 style="margin-bottom:12px;font-size:15px;">${PHONE_ICON_SVG} Nuovo ordine telefonico</h3>
      <div class="field"><label>Nome cliente (facoltativo)</label><input id="po-name" placeholder="Es. Sig. Rossi"></div>
      <div class="ph" style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">Cosa ha ordinato?</div>
      <div id="po-menu"></div>
      <div class="row" style="margin:14px 0;">
        <button class="btn btn-primary btn-sm" data-off="0" id="po-day0">Oggi</button>
        <button class="btn btn-ghost btn-sm" data-off="1" id="po-day1">Domani</button>
        <button class="btn btn-ghost btn-sm" data-off="2" id="po-day2">Dopodomani</button>
      </div>
      <div class="ph" style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">Scegli l'orario da occupare:</div>
      <div class="slot-grid" id="po-slots"></div>
    </div>`;

    function renderPoMenu(){
      const menuEl = area.querySelector('#po-menu');
      menuEl.innerHTML = '';
      if(!t.menu || t.menu.length===0){
        menuEl.innerHTML = '<p class="small-note">Nessuna voce a menu configurata: puoi comunque occupare la fascia oraria senza dettaglio piatti.</p>';
        return;
      }
      const cats = [];
      t.menu.forEach(item=>{ const c = item.category||'Altro'; if(!cats.includes(c)) cats.push(c); });
      cats.forEach(cat=>{
        if(cats.length > 1 || cat !== 'Altro'){
          const header = document.createElement('div');
          header.style.cssText = 'font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;margin:10px 0 4px;';
          header.textContent = cat;
          menuEl.appendChild(header);
        }
        t.menu.forEach(item=>{
          if((item.category||'Altro') !== cat) return;
          const qty = poCart[item.id] || 0;
          const row = document.createElement('div');
          row.className = 'menu-item';
          row.innerHTML = `<div><div class="mi-name">${item.name}</div><div class="mi-price">€ ${Number(item.price).toFixed(2)}</div></div>
            <div class="qty-ctrl"><button class="qty-btn" data-act="minus" data-id="${item.id}">–</button><span class="qty-num">${qty}</span><button class="qty-btn" data-act="plus" data-id="${item.id}">+</button></div>`;
          menuEl.appendChild(row);
        });
      });
      menuEl.querySelectorAll('.qty-btn').forEach(b=>{
        b.onclick = ()=>{
          const id = b.dataset.id;
          const cur = poCart[id] || 0;
          poCart[id] = b.dataset.act==='plus' ? cur+1 : Math.max(0, cur-1);
          if(poCart[id]===0) delete poCart[id];
          renderPoMenu();
        };
      });
    }
    renderPoMenu();

    const dayButtons = { 0: area.querySelector('#po-day0'), 1: area.querySelector('#po-day1'), 2: area.querySelector('#po-day2') };
    async function refreshPoSlots(){
      Object.entries(dayButtons).forEach(([off,btn])=> btn.className = 'btn btn-sm ' + (Number(off)===selectedOffset ? 'btn-primary' : 'btn-ghost'));
      const grid = area.querySelector('#po-slots');
      grid.innerHTML = '<div class="spinner"></div>';
      const cfg = t.slots;
      const slots = genSlots(cfg.openFrom, cfg.openTo, cfg.slotMinutes);
      const date = todayStr(selectedOffset);
      const dayClosed = (t.closedDates||[]).includes(date);
      const blockedSet = new Set(t.blockedSlots||[]);
      const orders = await loadOrders(t.slug);
      grid.innerHTML = '';
      slots.forEach(time=>{
        const slotBlocked = dayClosed || blockedSet.has(date+'|'+time);
        const booked = orders.filter(o=> o.date===date && o.time===time && o.status!=='rejected').length;
        const remaining = slotBlocked ? 0 : cfg.capacityPerSlot - booked;
        const full = remaining <= 0;
        const btn = document.createElement('button');
        btn.className = 'slot' + (full ? ' full' : '');
        btn.innerHTML = `${time}<span class="cap">${slotBlocked ? 'chiusa' : (full ? 'pieno' : remaining+' post.')}</span>`;
        btn.disabled = full;
        btn.onclick = ()=> savePhoneOrder(t, date, time, area.querySelector('#po-name').value.trim(), poCart);
        grid.appendChild(btn);
      });
    }
    Object.entries(dayButtons).forEach(([off,btn])=> btn.onclick = ()=>{ selectedOffset = Number(off); refreshPoSlots(); });
    refreshPoSlots();
  }

  async function savePhoneOrder(t, date, time, customerName, cart){
    const items = (t.menu||[]).filter(m=>cart[m.id]>0).map(m=>({id:m.id, name:m.name, price:m.price, qty:cart[m.id]}));
    const total = items.reduce((s,i)=>s+i.price*i.qty,0);
    const order = {
      id: uid('T-'), customerName: customerName || 'Cliente telefonico', customerPhone: '—', note: '',
      items, total, date, time, status: 'confirmed', source: 'phone', createdAt: Date.now()
    };
    const ok = await saveOrderItem(t.slug, order);
    if(ok){ toast('Ordine telefonico registrato'); render(); }
    else toast('Errore, riprova.');
  }

  async function reportPanel(t, ownOrders, siblingsCount){
    const wrap = document.createElement('div');
    const statsArea = document.createElement('div');
    wrap.appendChild(statsArea);
    let currentOrders = ownOrders;
    let aggregateOn = false;

    if(siblingsCount > 1){
      const toggleRow = document.createElement('div');
      toggleRow.className = 'toggle-row';
      toggleRow.innerHTML = `<div><b>Vedi tutte le sedi insieme</b><span>Somma i dati di tutte le sedi del gruppo</span></div>
        <div class="switch" id="agg-switch"><div class="knob"></div></div>`;
      wrap.insertBefore(toggleRow, statsArea);
      toggleRow.querySelector('#agg-switch').onclick = async (e)=>{
        aggregateOn = !aggregateOn;
        e.currentTarget.classList.toggle('on', aggregateOn);
        if(aggregateOn){
          const siblings = await loadSiblingTenants(t);
          const all = await Promise.all(siblings.map(s=>loadOrders(s.slug)));
          currentOrders = all.flat();
        } else {
          currentOrders = ownOrders;
        }
        renderStats();
      };
    }

    function renderStats(){
      statsArea.innerHTML = '';
      const orders = currentOrders;
      const today = todayStr(0);
      const todayOrders = orders.filter(o=> o.date===today && o.status!=='rejected');
      const phoneCount = todayOrders.filter(o=>o.source==='phone').length;
      const onlineCount = todayOrders.length - phoneCount;
      const bySlot = {};
      todayOrders.forEach(o=>{ bySlot[o.time] = (bySlot[o.time]||0)+1; });
      let busiest = null;
      Object.entries(bySlot).forEach(([time,count])=>{ if(!busiest || count>busiest.count) busiest = {time, count}; });

      const card1 = document.createElement('div');
      card1.className = 'card';
      card1.innerHTML = `<h3 style="margin-bottom:12px;font-size:15px;">Oggi</h3>
        <div class="row" style="text-align:center;margin-bottom:6px;">
          <div><div style="font-size:26px;font-weight:700;color:var(--accent,var(--crust));">${todayOrders.length}</div><div class="small-note" style="margin:0;">ordini totali</div></div>
          <div><div style="font-size:26px;font-weight:700;color:var(--accent,var(--crust));">${onlineCount}</div><div class="small-note" style="margin:0;">online</div></div>
          <div><div style="font-size:26px;font-weight:700;color:var(--accent,var(--crust));">${phoneCount}</div><div class="small-note" style="margin:0;">telefonici</div></div>
        </div>
        ${busiest ? `<p class="small-note" style="margin-top:14px;">Fascia più richiesta oggi: <b style="color:var(--parchment);">${busiest.time}</b> (${busiest.count} ordini)</p>` : ''}`;
      statsArea.appendChild(card1);

      if(!hasPlus(t)){
        return;
      }

      const last7 = []; for(let i=0;i<7;i++) last7.push(todayStr(-i));
      const prev7 = []; for(let i=7;i<14;i++) prev7.push(todayStr(-i));
      const thisWeekCount = orders.filter(o=> last7.includes(o.date) && o.status!=='rejected').length;
      const lastWeekCount = orders.filter(o=> prev7.includes(o.date) && o.status!=='rejected').length;
      const diff = thisWeekCount - lastWeekCount;
      const diffText = lastWeekCount===0 ? '' : (diff>=0 ? `+${diff}` : `${diff}`) + ' rispetto alla settimana precedente';

      const weekCard = document.createElement('div');
      weekCard.className = 'card';
      weekCard.innerHTML = `<h3 style="margin-bottom:8px;font-size:15px;">Questa settimana</h3>
        <p style="font-size:15px;margin:0;"><b style="font-size:20px;color:var(--accent,var(--crust));">${thisWeekCount}</b> ordini ${diffText ? `<span class="small-note" style="margin:0;">(${diffText})</span>` : ''}</p>
        <button class="btn btn-ghost btn-block" id="export-csv" style="margin-top:16px;">⬇️ Scarica report (Excel/CSV)</button>`;
      statsArea.appendChild(weekCard);
      weekCard.querySelector('#export-csv').onclick = ()=> exportOrdersCSV(currentOrders, t.name);

      const cfg = t.slots;
      const slots = genSlots(cfg.openFrom, cfg.openTo, cfg.slotMinutes);
      const last14 = []; for(let i=0;i<14;i++) last14.push(todayStr(-i));
      const stats = {};
      slots.forEach(time=> stats[time] = {full:0,total:0});
      last14.forEach(date=>{
        slots.forEach(time=>{
          const count = orders.filter(o=> o.date===date && o.time===time && o.status!=='rejected').length;
          stats[time].total++;
          if(count >= cfg.capacityPerSlot) stats[time].full++;
        });
      });
      const flagged = Object.entries(stats)
        .map(([time,s])=> ({time, ratio: s.total ? s.full/s.total : 0, full:s.full, total:s.total}))
        .filter(s=> s.total>=4 && s.ratio>=0.6)
        .sort((a,b)=> b.ratio-a.ratio);

      const sugCard = document.createElement('div');
      sugCard.className = 'card';
      if(flagged.length===0){
        sugCard.innerHTML = `<h3 style="margin-bottom:8px;font-size:15px;">Suggerimento capacità</h3>
          <p class="small-note">Non ci sono ancora abbastanza dati (servono almeno alcuni giorni di storico) o nessuna fascia è costantemente piena.</p>`;
      } else {
        sugCard.innerHTML = `<h3 style="margin-bottom:8px;font-size:15px;">💡 Suggerimento capacità</h3>
          <p class="small-note" style="margin-bottom:10px;">Negli ultimi 14 giorni, queste fasce sono risultate piene quasi sempre — potresti valutare di aumentarne la capacità:</p>`;
        flagged.slice(0,5).forEach(f=>{
          const line = document.createElement('p');
          line.style.cssText = 'margin:4px 0;font-size:14px;';
          line.innerHTML = `<b style="color:var(--accent,var(--crust));">${f.time}</b> — piena ${f.full} giorni su ${f.total} osservati`;
          sugCard.appendChild(line);
        });
      }
      statsArea.appendChild(sugCard);

      const dishCounts = {};
      orders.filter(o=>o.status!=='rejected').forEach(o=>{
        (o.items||[]).forEach(i=>{ dishCounts[i.name] = (dishCounts[i.name]||0) + i.qty; });
      });
      const topDishes = Object.entries(dishCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const dishCard = document.createElement('div');
      dishCard.className = 'card';
      if(topDishes.length===0){
        dishCard.innerHTML = `<h3 style="margin-bottom:8px;font-size:15px;">Piatti più venduti</h3><p class="small-note">Non ci sono ancora abbastanza ordini con dettaglio piatti.</p>`;
      } else {
        dishCard.innerHTML = `<h3 style="margin-bottom:10px;font-size:15px;">🍽️ Piatti più venduti</h3>`;
        topDishes.forEach(([name,qty])=>{
          const line = document.createElement('div');
          line.style.cssText = 'display:flex;justify-content:space-between;padding:5px 0;font-size:14px;';
          line.innerHTML = `<span>${name}</span><b style="color:var(--accent,var(--crust));">${qty}</b>`;
          dishCard.appendChild(line);
        });
      }
      statsArea.appendChild(dishCard);
    }
    renderStats();
    return wrap;
  }

  function exportOrdersCSV(orders, tenantName){
    const headers = ['Data','Ora','Cliente','Telefono','Origine','Stato','Piatti','Totale'];
    const rows = orders.slice().sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time)).map(o=>{
      const items = (o.items||[]).map(i=>`${i.qty}x ${i.name}`).join(' | ');
      const csvEscape = (v)=> `"${String(v==null?'':v).replace(/"/g,'""')}"`;
      return [o.date, o.time, o.customerName, o.customerPhone, o.source==='phone'?'Telefono':'Online', statusLabel(o.status), items, (o.total||0).toFixed(2)].map(csvEscape).join(',');
    });
    const csv = [headers.join(','), ...rows].join('\r\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `report-${tenantName.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${todayStr(0)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function toggleProposePicker(cardEl, o, t){
    const area = cardEl.querySelector(`#propose-${o.id}`);
    const isOpen = area.style.display !== 'none';
    if(isOpen){ area.style.display='none'; return; }
    area.style.display='block';
    area.innerHTML = `<div class="ph">Scegli il nuovo orario per lo stesso giorno (${dayLabelFromDate(o.date)}):</div><div class="slot-grid"></div>`;
    const grid = area.querySelector('.slot-grid');
    grid.innerHTML = '<div class="spinner"></div>';
    const cfg = t.slots;
    const slots = genSlots(cfg.openFrom, cfg.openTo, cfg.slotMinutes);
    const blockedSet = new Set(t.blockedSlots||[]);
    const orders = await loadOrders(t.slug);
    grid.innerHTML = '';
    slots.forEach(time=>{
      const slotBlocked = blockedSet.has(o.date+'|'+time);
      const booked = orders.filter(x=> x.date===o.date && x.time===time && x.status!=='rejected' && x.id!==o.id).length;
      const remaining = slotBlocked ? 0 : cfg.capacityPerSlot - booked;
      const full = remaining <= 0;
      const btn = document.createElement('button');
      btn.className = 'slot' + (full ? ' full' : '');
      btn.innerHTML = `${time}<span class="cap">${slotBlocked ? 'chiusa' : (full ? 'pieno' : remaining+' post.')}</span>`;
      btn.disabled = full;
      btn.onclick = ()=> proposeNewTime(t.slug, o.id, o.date, time);
      grid.appendChild(btn);
    });
  }

  async function proposeNewTime(slug, orderId, date, time){
    const order = await sGet('orderitem:'+slug+':'+orderId);
    if(!order) return;
    order.status = 'proposed';
    order.proposedDate = date;
    order.proposedTime = time;
    const ok = await saveOrderItem(slug, order);
    if(ok){ toast('Nuovo orario proposto al cliente'); render(); }
    else toast('Errore, riprova.');
  }

  async function updateOrderStatus(slug, orderId, status){
    const order = await sGet('orderitem:'+slug+':'+orderId);
    if(!order) return;
    order.status = status;
    if(status==='pending'){ delete order.proposedDate; delete order.proposedTime; }
    const ok = await saveOrderItem(slug, order);
    if(ok){ toast(status==='confirmed' ? 'Ordine confermato' : status==='rejected' ? 'Ordine rifiutato' : status==='pending' ? 'Proposta annullata' : 'Aggiornato'); render(); }
    else toast('Errore, riprova.');
  }

      const dates = (t.closedDates||[]).filter(d=> d >= todayStr(0)).sort();
      if(dates.length===0){ listEl.innerHTML = '<p class="small-note">Nessuna data futura chiusa al momento.</p>'; return; }
      listEl.innerHTML = '<p class="small-note" style="margin-bottom:8px;">Date attualmente chiuse:</p>';
      dates.forEach(d=>{
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);';

        rm.onclick = async ()=>{
          const cur = JSON.parse(JSON.stringify(t));
          cur.closedDates = (cur.closedDates||[]).filter(x=>x!==d);
          const ok = await sSet('tenant:'+cur.slug, cur);
          if(ok){ Object.assign(t, cur); setState({activeTenant:cur}); }
        };
        row.appendChild(rm);
        listEl.appendChild(row);
      });
    }
    renderList();
    area.querySelector('#pd-save').onclick = async ()=>{
      const from = area.querySelector('#pd-from').value;
      const to = area.querySelector('#pd-to').value;
      if(!from || !to || to < from){ toast('Controlla le date scelte.'); return; }
      const cur = JSON.parse(JSON.stringify(t));
      const closedDates = new Set(cur.closedDates||[]);
      let d = new Date(from+'T00:00:00');
      const end = new Date(to+'T00:00:00');
      while(d <= end){ closedDates.add(d.toISOString().slice(0,10)); d.setDate(d.getDate()+1); }
      cur.closedDates = Array.from(closedDates);
      const ok = await sSet('tenant:'+cur.slug, cur);
      if(ok){ toast('Periodo chiuso'); setState({activeTenant:cur}); }
      else toast('Errore, riprova.');
    };
  }

  async function downloadBackup(){
    const tenantIndex = (await sGet('tenant_index')) || [];
    const tenants = {};
    for(const slug of tenantIndex){ tenants[slug] = await sGet('tenant:'+slug); }
    const orders = {};
    for(const slug of tenantIndex){ orders[slug] = await sGet('orders:'+slug); }
    const adminConfig = await sGet('admin_config');
    const backup = { version: 1, exportedAt: new Date().toISOString(), tenant_index: tenantIndex, tenants, orders, admin_config: adminConfig };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `praesto-backup-${todayStr(0)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup scaricato');
  }

  function restoreBackup(file){
    if(!file) return;
    if(!confirm('Ripristinare questo backup sovrascriverà i dati attuali nel browser. Continuare?')) return;
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!data.tenant_index){ toast('File di backup non valido.'); return; }
        await sSet('tenant_index', data.tenant_index);
        for(const slug of data.tenant_index){
          if(data.tenants[slug]) await sSet('tenant:'+slug, data.tenants[slug]);
          if(data.orders[slug]) await sSet('orders:'+slug, data.orders[slug]);
        }
        if(data.admin_config) await sSet('admin_config', data.admin_config);
        toast('Backup ripristinato');
        const tenants = await loadAllTenants();
        setState({tenants, view:'adminPanel'});
      } catch(err){ console.error(err); toast('Errore nella lettura del file.'); }
    };
    reader.readAsText(file);
  }

  function importMenuFromExcel(file, d, refreshEditor){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(rows.length===0){ toast('Il file sembra vuoto.'); return; }
        const findKey = (row, candidates)=> Object.keys(row).find(k=> candidates.includes(k.trim().toLowerCase()));
        if(!d.menu) d.menu = [];
        let added = 0;
        rows.forEach(row=>{
          const nameKey = findKey(row, ['nome','piatto','nome piatto']);
          const priceKey = findKey(row, ['prezzo','€','price','prezzo normale']);
          const famPriceKey = findKey(row, ['prezzo famiglia','famiglia','prezzo grande','family']);
          const catKey = findKey(row, ['categoria','category']);
          const descKey = findKey(row, ['descrizione','description']);
          const nameEnKey = findKey(row, ['nome en','name en','english name','nome inglese']);
          const descEnKey = findKey(row, ['descrizione en','description en','english description','descrizione inglese']);
          const catEnKey = findKey(row, ['categoria en','category en','english category','categoria inglese']);
          const name = nameKey ? String(row[nameKey]).trim() : '';
          const price = priceKey ? parseFloat(String(row[priceKey]).replace(',','.')) : NaN;
          const famPrice = famPriceKey ? parseFloat(String(row[famPriceKey]).replace(',','.')) : NaN;
          if(!name || isNaN(price)) return;
          const category = (catKey && String(row[catKey]).trim()) || '';
          const desc = (descKey && String(row[descKey]).trim()) || '';
          const nameEn = (nameEnKey && String(row[nameEnKey]).trim()) || '';
          const descEn = (descEnKey && String(row[descEnKey]).trim()) || '';
          const catEn = (catEnKey && String(row[catEnKey]).trim()) || '';
          if(category && catEn){ if(!d.categoryTranslations) d.categoryTranslations = {}; d.categoryTranslations[category] = catEn; }
          if(!isNaN(famPrice)){
            const groupId = uid('G-');
            const base = { groupName: name, variantGroup: groupId };
            if(category) base.category = category;
            if(desc) base.desc = desc;
            if(nameEn) base.groupNameEn = nameEn;
            if(descEn) base.descEn = descEn;
            d.menu.push({ id: uid('M-'), name: `${name} (Normale)`, price, variantLabel:'Normale', ...base });
            d.menu.push({ id: uid('M-'), name: `${name} (Famiglia)`, price: famPrice, variantLabel:'Famiglia', ...base });
            added += 2;
          } else {
            const entry = {id: uid('M-'), name, price};
            if(category) entry.category = category;
            if(desc) entry.desc = desc;
            if(nameEn) entry.nameEn = nameEn;
            if(descEn) entry.descEn = descEn;
            d.menu.push(entry);
            added++;
          }
        });
        if(added===0){ toast('Nessuna riga valida trovata: controlla le intestazioni delle colonne.'); return; }
        refreshEditor();
        toast(`${added} voci aggiunte dal file`);
      } catch(err){ console.error(err); toast('Errore nella lettura del file Excel.'); }
    };
    reader.readAsBinaryString(file);
  }

            const row = document.createElement('div'); row.className='menu-item';
            row.innerHTML = `<div><div class="mi-name">${m.name}</div>${m.desc ? `<div class="mi-price" style="color:var(--parchment-dim);">${m.desc}</div>` : ''}<div class="mi-price">€ ${m.price.toFixed(2)}</div></div>`;
            const rm = document.createElement('button'); rm.className='btn btn-ghost btn-sm'; rm.textContent='Rimuovi';
            rm.onclick = ()=>{ d.menu.splice(i,1); renderMenuEditor(); };
            row.appendChild(rm);
            ed.appendChild(row);
          }
        });
      });
      if(items.length===0){ ed.innerHTML = '<p class="small-note">Nessuna voce ancora.</p>'; }
      const catSelect = wrap.querySelector('#new-item-cat-select');
      if(catSelect){
        const prevValue = catSelect.value;
        catSelect.innerHTML = '<option value="">Nessuna categoria</option>'
          + cats.map(c=>`<option value="${c}">${c}</option>`).join('')
          + '<option value="__new__">+ Nuova categoria…</option>';
        if([...catSelect.options].some(o=>o.value===prevValue)) catSelect.value = prevValue;
      }
    }
    renderMenuEditor();

    setTimeout(()=>{
      wrap.querySelector('#atf-back').onclick = ()=> setState({view:'adminPanel'});
      wrap.querySelector('#d-name').oninput = e => d.name = e.target.value;
      wrap.querySelector('#d-emoji').oninput = e => d.emoji = e.target.value;
      wrap.querySelector('#d-open').oninput = e => d.slots.openFrom = e.target.value;
      wrap.querySelector('#d-close').oninput = e => d.slots.openTo = e.target.value;
      wrap.querySelector('#d-slotmin').oninput = e => d.slots.slotMinutes = Number(e.target.value);
      wrap.querySelector('#d-cap').oninput = e => d.slots.capacityPerSlot = Number(e.target.value);
      wrap.querySelector('#d-pin').oninput = e => d.pin = e.target.value;
      wrap.querySelector('#d-group').oninput = e => d.groupSlug = e.target.value.trim();
      wrap.querySelector('#d-plan').onchange = e => d.plan = e.target.value;
      wrap.querySelector('#d-plustrial').oninput = e => d.plusTrialUntil = e.target.value;
      wrap.querySelector('#d-review').oninput = e => d.googleReviewLink = e.target.value.trim();
      wrap.querySelector('#d-logo').onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (ev)=>{
          img.onload = ()=>{
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const scale = Math.max(size/img.width, size/img.height);
            const w = img.width*scale, h = img.height*scale;
            ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
            d.logoDataUrl = canvas.toDataURL('image/png', 0.85);
            wrap.querySelector('#logo-preview').innerHTML = `<img src="${d.logoDataUrl}" style="height:48px;border-radius:8px;">`;
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };
      wrap.querySelector('#d-slug').oninput = e => { if(isNew) d.customSlug = e.target.value.trim(); else d.newSlug = e.target.value.trim(); };
      wrap.querySelector('#new-item-cat-select').onchange = (e)=>{
        const newCatInput = wrap.querySelector('#new-item-cat-new');
        newCatInput.style.display = e.target.value === '__new__' ? 'block' : 'none';
        if(e.target.value === '__new__') newCatInput.focus();
      };
      wrap.querySelector('#add-item').onclick = ()=>{
        const nameEl = wrap.querySelector('#new-item-name'), catSelectEl = wrap.querySelector('#new-item-cat-select'), catNewEl = wrap.querySelector('#new-item-cat-new'), descEl = wrap.querySelector('#new-item-desc'), priceEl = wrap.querySelector('#new-item-price'), priceFamEl = wrap.querySelector('#new-item-price-family');
        const nameEnEl = wrap.querySelector('#new-item-name-en'), descEnEl = wrap.querySelector('#new-item-desc-en');
        const name = nameEl.value.trim();
        const category = catSelectEl.value === '__new__' ? catNewEl.value.trim() : catSelectEl.value;
        const desc = descEl.value.trim(); const price = parseFloat(priceEl.value);
        const familyPrice = parseFloat(priceFamEl.value);
        const nameEn = nameEnEl.value.trim(); const descEn = descEnEl.value.trim();
        if(!name || isNaN(price)){ toast('Inserisci nome e prezzo validi'); return; }
        if(!d.menu) d.menu = [];
        if(!isNaN(familyPrice)){
          const groupId = uid('G-');
          const base = { groupName: name, variantGroup: groupId, desc, category };
          if(nameEn) base.groupNameEn = nameEn;
          if(descEn) base.descEn = descEn;
          d.menu.push({ id: uid('M-'), name: `${name} (Normale)`, price, variantLabel:'Normale', ...base });
          d.menu.push({ id: uid('M-'), name: `${name} (Famiglia)`, price: familyPrice, variantLabel:'Famiglia', ...base });
        } else {
          const entry = {id: uid('M-'), name, price};
          if(desc) entry.desc = desc;
          if(category) entry.category = category;
          if(nameEn) entry.nameEn = nameEn;
          if(descEn) entry.descEn = descEn;
          d.menu.push(entry);
        }
        nameEl.value=''; descEl.value=''; priceEl.value=''; priceFamEl.value=''; catSelectEl.value=''; catNewEl.value=''; catNewEl.style.display='none';
        nameEnEl.value=''; descEnEl.value='';
        renderMenuEditor();
      };
      wrap.querySelector('#excel-file').onchange = (e)=> importMenuFromExcel(e.target.files[0], d, renderMenuEditor);
      wrap.querySelector('#d-save').onclick = saveTenantDraft;
      const linkBtn = wrap.querySelector('#d-showlink');
      if(linkBtn) linkBtn.onclick = ()=> setState({view:'adminTenantLink'});
    },0);
    return wrap;
  }

  function isValidSlug(s){ return /^[a-z0-9]+(-[a-z0-9]+)*$/.test(s); }
  function hasPlus(t){
    if(t.plan === 'plus') return true;
    if(t.plusTrialUntil && t.plusTrialUntil >= todayStr(0)) return true;
    return false;
  }

  async function saveTenantDraft(){
    const d = state.adminDraft;
    if(!d.name || !d.name.trim()){ toast('Inserisci il nome del locale'); return; }
    const isNew = !state.adminEditingSlug;
    if(isNew && (!d.pin || !d.pin.trim())){ toast('Imposta un PIN gestore'); return; }
    let tenants = state.tenants.slice();
    if(isNew){
      let slug;
      if(d.customSlug && d.customSlug.trim()){
        slug = d.customSlug.trim().toLowerCase();
        if(!isValidSlug(slug)){ toast('Codice non valido: usa solo lettere minuscole, numeri e trattini.'); return; }
        const existingIndex = (await sGet('tenant_index')) || [];
        if(existingIndex.includes(slug)){ toast('Questo codice è già in uso, scegline un altro.'); return; }
      } else {
        slug = d.name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + uid('').toLowerCase();
      }
      const pinHash = await sha256(d.pin.trim());
      const tenant = { slug, name:d.name.trim(), emoji:d.emoji||'', accent:d.accent, pinHash, slots:d.slots, menu:d.menu||[], closedDates:[], groupSlug:d.groupSlug||'', plan:d.plan||'base', plusTrialUntil:d.plusTrialUntil||'', logoDataUrl:d.logoDataUrl||'', googleReviewLink:d.googleReviewLink||'', categoryTranslations:d.categoryTranslations||{} };
      tenants.push(tenant);
      await sSet('tenant:'+slug, tenant);
      await sSet('orders:'+slug, []);
      const slugIndex = (await sGet('tenant_index')) || [];
      slugIndex.push(slug);
      await sSet('tenant_index', slugIndex);
      setState({tenants, view:'adminTenantLink', adminEditingSlug:slug, adminDraft: JSON.parse(JSON.stringify(tenant))});
      toast('Pizzeria creata');
    } else {
      const idx = tenants.findIndex(x=>x.slug===state.adminEditingSlug);
      if(idx===-1) return;
      const existing = tenants[idx];
      let finalSlug = existing.slug;
      const wantsRename = d.newSlug && d.newSlug.trim() && d.newSlug.trim().toLowerCase() !== existing.slug;
      if(wantsRename){
        const newSlug = d.newSlug.trim().toLowerCase();
        if(!isValidSlug(newSlug)){ toast('Codice non valido: usa solo lettere minuscole, numeri e trattini.'); return; }
        const existingIndex = (await sGet('tenant_index')) || [];
        if(existingIndex.includes(newSlug)){ toast('Questo codice è già in uso, scegline un altro.'); return; }
        if(!confirm('Il link e il QR attuali smetteranno di funzionare. Continuare?')) return;
        finalSlug = newSlug;
      }
      const updated = { ...existing, slug: finalSlug, name:d.name.trim(), emoji:d.emoji||'', accent:d.accent, slots:d.slots, menu:d.menu||[], groupSlug:d.groupSlug||'', plan:d.plan||'base', plusTrialUntil:d.plusTrialUntil||'', logoDataUrl:d.logoDataUrl||'', googleReviewLink:d.googleReviewLink||'', categoryTranslations: d.categoryTranslations || existing.categoryTranslations || {} };
      if(d.pin && d.pin.trim()){ updated.pinHash = await sha256(d.pin.trim()); }
      if(wantsRename){
        const oldOrders = await loadOrders(existing.slug);
        await sSet('tenant:'+finalSlug, updated);
        await sSet('orders:'+finalSlug, oldOrders);
        await sDelete('tenant:'+existing.slug);
        await sDelete('orders:'+existing.slug);
        const slugIndex = ((await sGet('tenant_index')) || []).map(s=> s===existing.slug ? finalSlug : s);
        await sSet('tenant_index', slugIndex);
      } else {
        await sSet('tenant:'+updated.slug, updated);
      }
      tenants[idx] = updated;
      setState({tenants, view:'adminPanel', adminEditingSlug:finalSlug});
      toast(wantsRename ? 'Locale rinominato' : 'Modifiche salvate');
    }
  }

  function viewAdminTenantLink(){
    const t = state.tenants.find(x=>x.slug===state.adminEditingSlug) || state.adminDraft;
    const link = buildTenantLink(t.slug);
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <button class="link-back" id="atl-back">&larr; Torna alla scheda locale</button>
      <h2 style="margin-bottom:6px;">Link e QR — ${t.name}</h2>
      <p class="small-note" style="margin-bottom:14px;">Questo link è già online e funzionante. Da tenere presente: i dati (ordini, menu, disponibilità) restano legati a questo browser/dispositivo — se un cliente ordina dal proprio telefono e il locale controlla da un altro dispositivo, non si vedranno a vicenda finché non colleghiamo un database condiviso.</p>
      <div class="card">
        <div class="link-box">${link}</div>
        <div class="qr-wrap" id="qr-target"></div>
        <div class="divider"></div>
        <h3 style="margin-bottom:6px;font-size:15px;">Codice locale (accesso al pannello ordini)</h3>
        <div class="link-box">${t.slug}</div>
        <p class="small-note">Consegnalo insieme al PIN a chi nel locale gestirà gli ordini.</p>
      </div>`;
    setTimeout(()=>{
      wrap.querySelector('#atl-back').onclick = ()=> setState({view:'adminTenantForm', adminDraft: JSON.parse(JSON.stringify(t))});
      renderQR(wrap.querySelector('#qr-target'), link);
    },0);
    return wrap;
  }

  async function viewKitchenMode(){
    const t = state.activeTenant;
    document.documentElement.style.setProperty('--accent', t.accent);
    const wrap = document.createElement('div');
    wrap.style.maxWidth = '720px';
    wrap.innerHTML = `
      <button class="link-back" id="km-back" style="font-size:16px;">&larr; Esci dalla modalità cucina</button>
      <h2 style="margin-bottom:16px;">${t.name} — Cucina</h2>
      <div id="km-content"><div class="spinner"></div></div>`;
    setTimeout(()=>{ wrap.querySelector('#km-back').onclick = ()=> setState({view:'ownerDashboard', ownerTab:'prep'}); },0);
    const orders = await loadOrders(t.slug);
    const todo = orders.filter(o=> o.status==='confirmed');
    todo.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
    const content = wrap.querySelector('#km-content');
    content.innerHTML = '';
    if(todo.length===0){
      content.innerHTML = `<div class="empty"><div class="big" style="font-size:50px;">👨‍🍳</div><span style="font-size:20px;">Nessun ordine da preparare al momento.</span></div>`;
    } else {
      todo.forEach((o,i)=>{
        const itemsText = (o.items||[]).length ? o.items.map(x=>`${x.qty}× ${x.name}`).join(', ') : (o.source==='phone' ? 'Ordine telefonico' : '');
        const div = document.createElement('div');
        div.className = 'kitchen-card' + (i===0 ? ' next' : '');
        div.innerHTML = `
          <div class="kitchen-time">${o.time}</div>
          <div class="kitchen-info">
            ${i===0 ? '<span class="next-badge" style="font-size:13px;padding:4px 12px;">Prossimo</span><br>' : ''}
            <b>${o.source==='phone' ? phoneBadge()+' ' : ''}${o.customerName}</b>
            <div class="items">${itemsText}</div>
          </div>`;
        const btn = document.createElement('button');
        btn.className = 'btn btn-confirm'; btn.style.cssText='font-size:16px;padding:14px 20px;flex-shrink:0;';
        btn.textContent = 'Pronto';
        btn.onclick = ()=> updateOrderStatus(t.slug, o.id, 'ready');
        div.appendChild(btn);
        content.appendChild(div);
      });
    }
    return wrap;
  }

  // ---------------- render dispatcher ----------------
  let renderToken = 0;
  async function render(){
    const myToken = ++renderToken;
    let el;
    try{
      switch(state.view){
        case 'boot': case 'loadingTenant': root.innerHTML = '<div class="spinner"></div>'; return;
        case 'home': el = viewHome(); break;
        case 'linkInvalid': el = viewLinkInvalid(); break;
        case 'adminConnError': el = viewAdminConnError(); break;
        case 'customerOrder': el = viewCustomerOrder(); break;
        case 'customerConfirmation': el = viewCustomerConfirmation(); break;
        case 'customerCheckOrder': el = viewCustomerCheckOrder(); break;
        case 'ownerLogin': el = viewOwnerLogin(); break;
        case 'ownerDashboard': root.innerHTML='<div class="spinner"></div>'; el = await viewOwnerDashboard(); break;
        case 'kitchenMode': root.innerHTML='<div class="spinner"></div>'; el = await viewKitchenMode(); break;
        case 'adminAuth': el = viewAdminAuth(); break;
        case 'adminPanel': el = viewAdminPanel(); break;
        case 'adminTenantForm': el = viewAdminTenantForm(); break;
        case 'adminTenantLink': el = viewAdminTenantLink(); break;
        default: el = viewHome();
      }
    } catch(e){
      console.error('render failed', e);
      if(myToken !== renderToken) return;
      const errWrap = document.createElement('div');
      errWrap.innerHTML = `<div class="card" style="text-align:center;padding:30px 20px;">
        <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
        <h3 style="margin-bottom:8px;">Qualcosa è andato storto</h3>
        <p class="small-note" style="margin-bottom:16px;">Apri la console del browser (F12) per il dettaglio tecnico, oppure riprova.</p>
        <button class="btn btn-primary btn-block" id="err-retry">Riprova</button>
      </div>`;
      root.innerHTML = ''; root.appendChild(errWrap);
      errWrap.querySelector('#err-retry').onclick = ()=> setState({view:'home'});
      return;
    }
    if(myToken !== renderToken) return;
    root.innerHTML = ''; root.appendChild(el);
  }

  boot();
})();
</script>
</body>
</html>
